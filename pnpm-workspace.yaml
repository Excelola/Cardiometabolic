packages:
  - "."

nodeLinker: hoisted

allowBuilds:
  esbuild: false
  unrs-resolver: false

overrides:
  source-map-js: 1.2.2
  # Keep these transitive security fixes within their parents' published ranges.
  'minimatch@10.2.6>brace-expansion': 5.0.12
  'vitest@4.1.12>vite': 8.2.4

# Exact upstream security-patch release, matching binaries and ESLint tooling.
minimumReleaseAgeExclude:
  - '@next/env@16.4.6'
  - '@next/eslint-plugin-next@16.4.6'
  - '@next/swc-darwin-arm64@16.4.6'
  - '@next/swc-darwin-x64@16.4.6'
  - '@next/swc-linux-arm64-gnu@16.4.6'
  - '@next/swc-linux-arm64-musl@16.4.6'
  - '@next/swc-linux-x64-gnu@16.4.6'
  - '@next/swc-linux-x64-musl@16.4.6'
  - '@next/swc-win32-arm64-msvc@16.4.6'
  - '@next/swc-win32-x64-msvc@16.4.6'
  - eslint-config-next@16.4.6
  - next@16.4.6
