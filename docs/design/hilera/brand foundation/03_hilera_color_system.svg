<rect width="1600" height="1000" fill="#F7F4ED"/><text x="100" y="100" class="sans" font-size="18" font-weight="700" letter-spacing="4" fill="#7FA387">02 / COLOR SYSTEM</text><text x="100" y="170" class="serif" font-size="54" font-weight="700" fill="#183029">Muted green, carefully balanced</text><text x="100" y="215" class="sans" font-size="20" fill="#64736B">Mature saturation, cream surfaces and one restrained warm accent.</text><rect x="100" y="290" width="450" height="210" rx="26" fill="#1F3D2E" stroke="#D9E1DB"/><text x="128" y="342" class="sans" font-size="18" font-weight="700" fill="#F7F4ED">Forest</text><text x="128" y="374" class="sans" font-size="15" fill="#F7F4ED" opacity="0.78">Primary</text><text x="128" y="468" class="sans" font-size="24" font-weight="700" letter-spacing="2" fill="#F7F4ED">#1F3D2E</text><rect x="600" y="290" width="450" height="210" rx="26" fill="#355E46" stroke="#D9E1DB"/><text x="628" y="342" class="sans" font-size="18" font-weight="700" fill="#F7F4ED">Deep Green</text><text x="628" y="374" class="sans" font-size="15" fill="#F7F4ED" opacity="0.78">Secondary</text><text x="628" y="468" class="sans" font-size="24" font-weight="700" letter-spacing="2" fill="#F7F4ED">#355E46</text><rect x="1100" y="290" width="450" height="210" rx="26" fill="#7FA387" stroke="#D9E1DB"/><text x="1128" y="342" class="sans" font-size="18" font-weight="700" fill="#183029">Sage</text><text x="1128" y="374" class="sans" font-size="15" fill="#183029" opacity="0.78">Supporting</text><text x="1128" y="468" class="sans" font-size="24" font-weight="700" letter-spacing="2" fill="#183029">#7FA387</text><rect x="100" y="560" width="450" height="210" rx="26" fill="#DCE6D9" stroke="#D9E1DB"/><text x="128" y="612" class="sans" font-size="18" font-weight="700" fill="#183029">Mist</text><text x="128" y="644" class="sans" font-size="15" fill="#183029" opacity="0.78">Soft Surface</text><text x="128" y="738" class="sans" font-size="24" font-weight="700" letter-spacing="2" fill="#183029">#DCE6D9</text><rect x="600" y="560" width="450" height="210" rx="26" fill="#F7F4ED" stroke="#D9E1DB"/><text x="628" y="612" class="sans" font-size="18" font-weight="700" fill="#183029">Cream</text><text x="628" y="644" class="sans" font-size="15" fill="#183029" opacity="0.78">Canvas</text><text x="628" y="738" class="sans" font-size="24" font-weight="700" letter-spacing="2" fill="#183029">#F7F4ED</text><rect x="1100" y="560" width="450" height="210" rx="26" fill="#D8A77A" stroke="#D9E1DB"/><text x="1128" y="612" class="sans" font-size="18" font-weight="700" fill="#183029">Warm Accent</text><text x="1128" y="644" class="sans" font-size="15" fill="#183029" opacity="0.78">Micro Accent</text><text x="1128" y="738" class="sans" font-size="24" font-weight="700" letter-spacing="2" fill="#183029">#D8A77A</text>
<rect x="100" y="860" width="1400" height="76" rx="20" fill="#FFFFFF" stroke="#D9E1DB"/>
<circle cx="140" cy="898" r="10" fill="#1F3D2E"/>
<text x="168" y="905" class="sans" font-size="18" fill="#183029">Use Forest for primary actions and trust anchors. Use Sage and Mist for quiet emphasis. Warm Accent is reserved for tiny brand moments.</text>
