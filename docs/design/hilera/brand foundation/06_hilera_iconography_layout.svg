<rect width="1600" height="1000" fill="#F7F4ED"/><text x="100" y="100" class="sans" font-size="18" font-weight="700" letter-spacing="4" fill="#7FA387">05 / ICONOGRAPHY + LAYOUT</text><text x="100" y="170" class="serif" font-size="54" font-weight="700" fill="#183029">Quiet symbols. Generous space.</text><text x="100" y="215" class="sans" font-size="20" fill="#64736B">Thin-line icons, restrained status cues and deliberate negative space.</text><rect x="120" y="320" width="410" height="135" rx="24" fill="#FFFFFF" stroke="#D9E1DB"/><circle cx="182" cy="387" r="30" fill="#DCE6D9"/><text x="182" y="398" text-anchor="middle" class="sans" font-size="28" font-weight="700" fill="#1F3D2E">↗</text><text x="235" y="381" class="sans" font-size="21" font-weight="700" fill="#183029">Timeline</text><text x="235" y="411" class="sans" font-size="16" fill="#64736B">Simple outline language</text><rect x="590" y="320" width="410" height="135" rx="24" fill="#FFFFFF" stroke="#D9E1DB"/><circle cx="652" cy="387" r="30" fill="#DCE6D9"/><text x="652" y="398" text-anchor="middle" class="sans" font-size="28" font-weight="700" fill="#1F3D2E">✓</text><text x="705" y="381" class="sans" font-size="21" font-weight="700" fill="#183029">Evidence</text><text x="705" y="411" class="sans" font-size="16" fill="#64736B">Simple outline language</text><rect x="1060" y="320" width="410" height="135" rx="24" fill="#FFFFFF" stroke="#D9E1DB"/><circle cx="1122" cy="387" r="30" fill="#DCE6D9"/><text x="1122" y="398" text-anchor="middle" class="sans" font-size="28" font-weight="700" fill="#1F3D2E">◈</text><text x="1175" y="381" class="sans" font-size="21" font-weight="700" fill="#183029">Privacy</text><text x="1175" y="411" class="sans" font-size="16" fill="#64736B">Simple outline language</text><rect x="120" y="500" width="410" height="135" rx="24" fill="#FFFFFF" stroke="#D9E1DB"/><circle cx="182" cy="567" r="30" fill="#DCE6D9"/><text x="182" y="578" text-anchor="middle" class="sans" font-size="28" font-weight="700" fill="#1F3D2E">○</text><text x="235" y="561" class="sans" font-size="21" font-weight="700" fill="#183029">Profile</text><text x="235" y="591" class="sans" font-size="16" fill="#64736B">Simple outline language</text><rect x="590" y="500" width="410" height="135" rx="24" fill="#FFFFFF" stroke="#D9E1DB"/><circle cx="652" cy="567" r="30" fill="#DCE6D9"/><text x="652" y="578" text-anchor="middle" class="sans" font-size="28" font-weight="700" fill="#1F3D2E">→</text><text x="705" y="561" class="sans" font-size="21" font-weight="700" fill="#183029">Action</text><text x="705" y="591" class="sans" font-size="16" fill="#64736B">Simple outline language</text><rect x="1060" y="500" width="410" height="135" rx="24" fill="#FFFFFF" stroke="#D9E1DB"/><circle cx="1122" cy="567" r="30" fill="#DCE6D9"/><text x="1122" y="578" text-anchor="middle" class="sans" font-size="28" font-weight="700" fill="#1F3D2E">□</text><text x="1175" y="561" class="sans" font-size="21" font-weight="700" fill="#183029">Education</text><text x="1175" y="591" class="sans" font-size="16" fill="#64736B">Simple outline language</text>
<rect x="100" y="735" width="1400" height="180" rx="28" fill="#FFFFFF" stroke="#D9E1DB"/>
<text x="145" y="790" class="sans" font-size="16" font-weight="700" letter-spacing="2" fill="#7FA387">LAYOUT RULES</text>
<text x="145" y="840" class="sans" font-size="19" fill="#183029">• One clear purpose per screen    • One primary action    • Editorial breathing room    • Fewer cards, stronger hierarchy</text>
<text x="145" y="878" class="sans" font-size="19" fill="#183029">• Asymmetric marketing layouts    • Structured product layouts    • Mobile stacks naturally with full-width actions</text>
