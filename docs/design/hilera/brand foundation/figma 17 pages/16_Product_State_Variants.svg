<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>HILERA Product States</title>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#1F3D2E" flood-opacity="0.08"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="160%" height="180%">
    <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#1F3D2E" flood-opacity="0.06"/>
  </filter>
  <linearGradient id="heroWash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F7F4ED"/>
    <stop offset="100%" stop-color="#DCE6D9"/>
  </linearGradient>
  <style>
    .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
  </style>
</defs>
<rect width="1600" height="1000" fill="#F7F4ED"/>
<text x="90" y="95" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#7FA387">APPROVED WORKFLOW STATES</text><text x="90" y="155" class="serif" font-size="48" font-weight="700" fill="#183029">Product-state presentation board</text><g id="State-Account-Created"><rect x="90" y="220" width="700" height="145" rx="22" fill="#FFFFFF" stroke="#D9E1DB"/><g id="Pill-Account-Created"><rect x="118" y="246" width="127.0" height="32" rx="16" fill="#EEF3ED"/><text x="181.5" y="267" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#1F3D2E">Account Created</text></g><text x="118" y="312" class="sans" font-size="13.5" fill="#64736B">Account created. Continue to the required consent step.</text></g><g id="State-Consent-Required"><rect x="840" y="220" width="700" height="145" rx="22" fill="#FFFFFF" stroke="#D9E1DB"/><g id="Pill-Consent-Required"><rect x="868" y="246" width="134.4" height="32" rx="16" fill="#EEF3ED"/><text x="935.2" y="267" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#1F3D2E">Consent Required</text></g><text x="868" y="312" class="sans" font-size="13.5" fill="#64736B">Review the required information before health-data collection.</text></g><g id="State-Setup-Not-Started"><rect x="90" y="400" width="700" height="145" rx="22" fill="#FFFFFF" stroke="#D9E1DB"/><g id="Pill-Setup-Not-Started"><rect x="118" y="426" width="141.8" height="32" rx="16" fill="#EEF3ED"/><text x="188.9" y="447" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#1F3D2E">Setup Not Started</text></g><text x="118" y="492" class="sans" font-size="13.5" fill="#64736B">Start your basic profile and approved health setup.</text></g><g id="State-Setup-In-Progress"><rect x="840" y="400" width="700" height="145" rx="22" fill="#FFFFFF" stroke="#D9E1DB"/><g id="Pill-Setup-In-Progress"><rect x="868" y="426" width="141.8" height="32" rx="16" fill="#EEF3ED"/><text x="938.9" y="447" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#1F3D2E">Setup In Progress</text></g><text x="868" y="492" class="sans" font-size="13.5" fill="#64736B">Continue from the last completed step.</text></g><g id="State-Baseline-Data-Needed"><rect x="90" y="580" width="700" height="145" rx="22" fill="#FFFFFF" stroke="#D9E1DB"/><g id="Pill-Baseline-Data-Needed"><rect x="118" y="606" width="164.0" height="32" rx="16" fill="#EEF3ED"/><text x="200.0" y="627" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#1F3D2E">Baseline Data Needed</text></g><text x="118" y="672" class="sans" font-size="13.5" fill="#64736B">Add the approved baseline information required for the experience.</text></g><g id="State-Summary-Pending-Inputs"><rect x="840" y="580" width="700" height="145" rx="22" fill="#FFFFFF" stroke="#D9E1DB"/><g id="Pill-Summary-Pending-Inputs"><rect x="868" y="606" width="178.8" height="32" rx="16" fill="#EEF3ED"/><text x="957.4" y="627" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#1F3D2E">Summary Pending Inputs</text></g><text x="868" y="672" class="sans" font-size="13.5" fill="#64736B">Complete approved missing inputs before a summary can be generated.</text></g><g id="State-Summary-Available"><rect x="90" y="760" width="700" height="145" rx="22" fill="#FFFFFF" stroke="#D9E1DB"/><g id="Pill-Summary-Available"><rect x="118" y="786" width="141.8" height="32" rx="16" fill="#1F3D2E"/><text x="188.9" y="807" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#F7F4ED">Summary Available</text></g><text x="118" y="852" class="sans" font-size="13.5" fill="#64736B">The approved current summary is available.</text></g><g id="State-Active-Monitoring"><rect x="840" y="760" width="700" height="145" rx="22" fill="#FFFFFF" stroke="#D9E1DB"/><g id="Pill-Active-Monitoring"><rect x="868" y="786" width="141.8" height="32" rx="16" fill="#1F3D2E"/><text x="938.9" y="807" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#F7F4ED">Active Monitoring</text></g><text x="868" y="852" class="sans" font-size="13.5" fill="#64736B">Continue recording supported information and reviewing changes over</text><text x="868" y="873" class="sans" font-size="13.5" fill="#64736B">time.</text></g></svg>