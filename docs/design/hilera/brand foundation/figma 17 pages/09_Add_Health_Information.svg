</g><g id="Measurement-Entry-Form"><rect x="300" y="245" width="1080" height="660" rx="24" fill="#FFFFFF" stroke="#D9E1DB" filter="url(#shadow)"/><text x="345" y="300" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#7FA387">MANUAL ENTRY FOUNDATION</text><g id="Field-Measurement-type"><text x="345" y="355" class="sans" font-size="14" font-weight="700" fill="#183029">Measurement type</text><rect x="345" y="369" width="470" height="56" rx="14" fill="#FFFFFF" stroke="#D9E1DB"/><text x="363" y="404" class="sans" font-size="15" fill="#64736B">Choose a supported measurement</text></g><g id="Field-Value-and-unit"><text x="860" y="355" class="sans" font-size="14" font-weight="700" fill="#183029">Value and unit</text><rect x="860" y="369" width="470" height="56" rx="14" fill="#FFFFFF" stroke="#D9E1DB"/><text x="878" y="404" class="sans" font-size="15" fill="#64736B">Available after measurement selection</text></g><g id="Field-When-was-it-measured?"><text x="345" y="485" class="sans" font-size="14" font-weight="700" fill="#183029">When was it measured?</text><rect x="345" y="499" width="470" height="56" rx="14" fill="#FFFFFF" stroke="#D9E1DB"/><g id="Icon-calendar" transform="translate(363 515) scale(0.75)" fill="none" stroke="#64736B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16"/></g><text x="395" y="534" class="sans" font-size="15" fill="#64736B">Date and time</text></g><g id="Field-Source"><text x="860" y="485" class="sans" font-size="14" font-weight="700" fill="#183029">Source</text><rect x="860" y="499" width="470" height="56" rx="14" fill="#FFFFFF" stroke="#D9E1DB"/><text x="878" y="534" class="sans" font-size="15" fill="#64736B">User Entered</text></g><rect x="345" y="625" width="985" height="112" rx="18" fill="#EEF3ED" stroke="#D9E1DB"/><g id="Icon-info" transform="translate(372 655) scale(0.9166666666666666)" fill="none" stroke="#1F3D2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></g><text x="410" y="669" class="sans" font-size="14" font-weight="700" fill="#183029">Measurement specification required</text><text x="410" y="697" class="sans" font-size="13.5" fill="#64736B">Names, units, validation, context and clinical meaning must come from the approved measurement and clinical specifications.</text><g id="Button-Save-information">
