<g id="Icon-home" transform="translate(44 139) scale(0.8333333333333334)" fill="none" stroke="#64736B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L12 4l9 7.5V21H6V11.5Z"/><path d="M9.5 21v-6h5v6"/></g><text x="78" y="156" class="sans" font-size="15" font-weight="500" fill="#64736B">Dashboard</text><rect x="24" y="185" width="198" height="48" rx="13" fill="#EEF3ED"/><g id="Icon-plus" transform="translate(44 198) scale(0.8333333333333334)" fill="none" stroke="#1F3D2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g><text x="78" y="215" class="sans" font-size="15" font-weight="700" fill="#1F3D2E">Add data</text><g id="Icon-history" transform="translate(44 257) scale(0.8333333333333334)" fill="none" stroke="#64736B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 8A8 8 0 1 1 4 14"/><path d="M4.5 8V3.5M4.5 8H9"/><path d="M12 7v5l3 2"/></g><text x="78" y="274" class="sans" font-size="15" font-weight="500" fill="#64736B">History</text><g id="Icon-trend" transform="translate(44 316) scale(0.8333333333333334)" fill="none" stroke="#64736B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-5 4 3 7-9"/><path d="M16 7h4v4"/></g><text x="78" y="333" class="sans" font-size="15" font-weight="500" fill="#64736B">Trends</text><g id="Icon-summary" transform="translate(44 375) scale(0.8333333333333334)" fill="none" stroke="#64736B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6V3Z"/><path d="M15 3v5h5M9 12h7M9 16h6"/></g><text x="78" y="392" class="sans" font-size="15" font-weight="500" fill="#64736B">Summary</text><line x1="32" y1="860" x2="214" y2="860" stroke="#D9E1DB"/><g id="Icon-settings" transform="translate(44 890) scale(0.8333333333333334)" fill="none" stroke="#64736B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12l2-1-1-3-2 .2-1