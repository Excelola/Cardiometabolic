<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>HILERA Onboarding</title>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#1F3D2E" flood-opacity="0.08"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="160%" height="180%">
    <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#1F3D2E" flood-opacity="0.06"/>
  </filter>
  <linearGradient id="heroWash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F7F4ED"/>
    <stop offset="100%" stop-color="#DCE6D9"/>
  </linearGradient>
  <style>
    .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
  </style>
</defs>
<rect width="1440" height="1024" fill="#F7F4ED"/>
<g id="Topbar">
<rect x="0" y="0" width="1440" height="88" fill="#FFFFFF"/>
<line x1="0" y1="88" x2="1440" y2="88" stroke="#D9E1DB"/>

<g id="Brand-Lockup">

<g id="Logo-Mark" transform="translate(72 44) scale(0.78)">
  <circle cx="0" cy="0" r="29" fill="none" stroke="#1F3D2E" stroke-width="3"/>
  <rect x="-11" y="-14" width="6" height="29" rx="3" fill="#1F3D2E"/>
  <rect x="6" y="-5" width="6" height="20" rx="3" fill="#1F3D2E"/>
  <circle cx="9" cy="-14" r="4.5" fill="#D8A77A"/>
  <path d="M-5 2 C0 -5, 7 -8, 12 -7 C8 -1, 2 5, -5 9 Z" fill="#7FA387"/>
</g>
<text x="107.1" y="51.02" class="sans" font-size="20.28" font-weight="700" letter-spacing="4.68" fill="#1F3D2E">HILERA</text>
</g>
<text x="930" y="51" class="sans" font-size="14" font-weight="600" fill="#183029">How it works</text><text x="1027" y="51" class="sans" font-size="14" font-weight="600" fill="#183029">Why HILERA</text><text x="1124" y="51" class="sans" font-size="14" font-weight="600" fill="#183029">Learn</text><text x="1202" y="51" class="sans" font-size="14" font-weight="700" fill="#1F3D2E">Sign in</text><rect x="1270" y="24" width="126" height="40" rx="12" fill="#1F3D2E"/><text x="1333" y="50" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#F7F4ED">Create account</text></g><g id="Onboarding-Header"><text x="110" y="160" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#7FA387">PROGRESSIVE ONBOARDING</text><text x="110" y="220" class="serif" font-size="46" font-weight="700" fill="#183029">A few essentials first.</text><text x="110" y="260" class="sans" font-size="16" fill="#64736B">Complete what is needed now. You can return to the rest later.</text></g><g id="Step-1"><circle cx="130" cy="330" r="18" fill="#1F3D2E"/><text x="130" y="336" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#F7F4ED">1</text><text x="160" y="336" class="sans" font-size="14" font-weight="600" fill="#64736B">Consent</text></g><line x1="250" y1="330" x2="390" y2="330" stroke="#D9E1DB" stroke-width="2"/><g id="Step-2"><circle cx="430" cy="330" r="18" fill="#1F3D2E"/><text x="430" y="336" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#F7F4ED">2</text><text x="460" y="336" class="sans" font-size="14" font-weight="700" fill="#183029">About you</text></g><line x1="550" y1="330" x2="690" y2="330" stroke="#D9E1DB" stroke-width="2"/><g id="Step-3"><circle cx="730" cy="330" r="18" fill="#DCE6D9"/><text x="730" y="336" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#1F3D2E">3</text><text x="760" y="336" class="sans" font-size="14" font-weight="600" fill="#64736B">Health context</text></g><line x1="850" y1="330" x2="990" y2="330" stroke="#D9E1DB" stroke-width="2"/><g id="Step-4"><circle cx="1030" cy="330" r="18" fill="#DCE6D9"/><text x="1030" y="336" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#1F3D2E">4</text><text x="1060" y="336" class="sans" font-size="14" font-weight="600" fill="#64736B">Baseline</text></g><g id="About-You-Form"><rect x="110" y="390" width="1220" height="500" rx="28" fill="#FFFFFF" stroke="#D9E1DB" filter="url(#shadow)"/><text x="160" y="455" class="serif" font-size="31" font-weight="700" fill="#183029">About you</text><text x="160" y="490" class="sans" font-size="14" fill="#64736B">These are the approved basic profile fields for the V1 foundation.</text><g id="Field-Preferred-name"><text x="160" y="555" class="sans" font-size="14" font-weight="700" fill="#183029">Preferred name</text><rect x="160" y="569" width="500" height="56" rx="14" fill="#FFFFFF" stroke="#D9E1DB"/><text x="178" y="604" class="sans" font-size="15" fill="#64736B">What should HILERA call you?</text></g><g id="Field-Date-of-birth"><text x="720" y="555" class="sans" font-size="14" font-weight="700" fill="#183029">Date of birth</text><rect x="720" y="569" width="500" height="56" rx="14" fill="#FFFFFF" stroke="#D9E1DB"/><text x="738" y="604" class="sans" font-size="15" fill="#64736B">DD / MM / YYYY</text><text x="720" y="647" class="sans" font-size="12.5" fill="#64736B">Used as the source for age where an approved capability requires it.</text></g><g id="Field-Country-or-market"><text x="160" y="690" class="sans" font-size="14" font-weight="700" fill="#183029">Country or market</text><rect x="160" y="704" width="500" height="56" rx="14" fill="#FFFFFF" stroke="#D9E1DB"/><text x="178" y="739" class="sans" font-size="15" fill="#64736B">Nigeria</text><text x="160" y="782" class="sans" font-size="12.5" fill="#64736B">Supports Nigeria-first market context.</text></g><g id="Button-Continue">
<rect x="720" y="710" width="180" height="52" rx="14" fill="#1F3D2E" stroke="#1F3D2E"/>
<g id="Icon-arrow" transform="translate(738 724) scale(0.8333333333333334)" fill="none" stroke="#F7F4ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M14 7l5 5-5 5"/></g>
<text x="819.0" y="743" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#F7F4ED">Continue</text>
</g><g id="Button-Save-for-later">
<rect x="915" y="710" width="170" height="52" rx="14" fill="#FFFFFF" stroke="#D9E1DB"/>

<text x="1000.0" y="743" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#1F3D2E">Save for later</text>
</g></g></svg>