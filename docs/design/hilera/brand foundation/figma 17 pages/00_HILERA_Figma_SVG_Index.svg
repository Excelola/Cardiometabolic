</g><text x="110" y="220" class="serif" font-size="64" font-weight="700" fill="#F7F4ED">HILERA Product UI</text><text x="110" y="290" class="serif" font-size="54" font-style="italic" fill="#DCE6D9">12 route shells + supporting design system</text><text x="110" y="345" class="sans" font-size="18" fill="#D5E2D8">Figma-ready SVGs. Groups are named to preserve sensible layer structure after import.</text><text x="110" y="430" class="sans" font-size="14" font-weight="700" fill="#D8A77A">01</text><text x="152" y="430" class="sans" font-size="20" font-weight="700" fill="#F7F4ED">Landing</text><text x="420" y="430" class="sans" font-size="15" fill="#AFC3B1">/</text><text x="830" y="430" class="sans" font-size="14" font-weight="700" fill="#D8A77A">02</text><text x="872" y="430" class="sans" font-size="20" font-weight="700" fill="#F7F4ED">Sign up</text><text x="1140" y="430" class="sans" font-size="15" fill="#AFC3B1">/sign-up</text><text x="110" y="504" class="sans" font-size="14" font-weight="700" fill="#D8A77A">03</text><text x="152" y="504" class="sans" font-size="20" font-weight="700" fill="#F7F4ED">Sign in</text><text x="420" y="504" class="sans" font-size="15" fill="#AFC3B1">/sign-in</text><text x="830" y="504" class="sans" font-size="14" font-weight="700" fill="#D8A77A">04</text><text x="872" y="504" class="sans" font-size="20" font-weight="700" fill="#F7F4ED">Auth method</text><text x="1140" y="504" class="sans" font-size="15" fill="#AFC3B1">/auth</text><text x="110" y="578" class="sans" font-size="14" font-weight="700" fill="#D8A77A">05</text><text x="152" y="578" class="sans" font-size="20" font-weight="700" fill="#F7F4ED">Identifier variants</text><text x="420" y="578" class="sans" font-size="15" fill="#AFC3B1">/auth/identifier/[channel]</text><text x="830" y="578" class="sans" font-size="14" font-weight="700" fill="#D8A77A">06</text><text x="872" y="578" class="sans" font-size="20" font-weight="700" fill="#F7F4ED">Verify</text><text x="1140" y="578" class="sans" font-size="15" fill="#AFC3B1">/auth/verify</text><text x="110" y="652" class="sans" font-size="14" font-weight="700" fill="#D8A77A">07</text><text x="152" y="652" class="sans" font-size="20" font-weight="700" fill="#F7F4ED">Onboarding</text><text x="420" y="652" class="sans" font-size="15" fill="#AFC3B1">/onboarding</text><text x="830" y="652" class="sans" font-size="14" font-weight="700" fill="#D8A77A">08</text><text x="872" y="652" class="sans" font-size="20" font-weight="700" fill="#F7F4ED">Dashboard</text><text x="1140" y="652" class="sans" font-size="15" fill="#AFC3B1">/app/dashboard</text><text x="110" y="726" class="sans" font-size="14" font-weight="700" fill="#D8A77A">09</text><text x="152" y="726" class="sans" font-size="20" font-weight="700" fill="#F7F4ED">Add health information</text><text x="420" y="726" class="sans" font-size="15" fill="#AFC3B1">/app/measurements/new</text><text x="830" y="726" class="sans" font-size="14" font-weight="700" fill="#D8A77A">10</text><text x="872" y="726" class="sans" font-size="20" font-weight="700" fill="#F7F4ED">Measurement history</text><text x="1140" y="726" class="sans" font-size="15" fill="#AFC3B1">/app/measurements/history</text><text x="110" y="800" class="sans" font-size="14" font-weight="700" fill="#D8A77A">11</text><text x="152" y="800" class="sans" font-size="20" font-weight="700" fill="#F7F4ED">Trends</text><text x="420" y="800" class="sans" font-size="15" fill="#AFC3B1">/app/trends</text><text x="830" y="800" class="sans" font-size="14" font-weight="700" fill="#D8A77A">12</text><text x="872" y="800" class="sans" font-size="20" font-weight="700" fill="#F7F4ED">Risk Awareness Summary</text><text x="1140" y="800" class="sans" font-size="15" fill="#AFC3B1">/app/risk-summary</text><text x="110" y="922" class="sans" font-size="14" letter-spacing="2" fill="#7FA387">SUPPORTING SVGs: BRAND TOKENS • COMPONENTS • PRODUCT STATES • ERROR / NOT FOUND</text></svg>