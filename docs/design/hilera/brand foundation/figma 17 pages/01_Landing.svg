</g>
<text x="107.1" y="51.02" class="sans" font-size="20.28" font-weight="700" letter-spacing="4.68" fill="#1F3D2E">HILERA</text>
</g>
<text x="930" y="51" class="sans" font-size="14" font-weight="600" fill="#183029">How it works</text><text x="1027" y="51" class="sans" font-size="14" font-weight="600" fill="#183029">Why HILERA</text><text x="1124" y="51" class="sans" font-size="14" font-weight="600" fill="#183029">Learn</text><text x="1202" y="51" class="sans" font-size="14" font-weight="700" fill="#1F3D2E">Sign in</text><rect x="1270" y="24" width="126" height="40" rx="12" fill="#1F3D2E"/><text x="1333" y="50" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#F7F4ED">Create account</text></g><g id="Hero-Background"><rect x="760" y="88" width="680" height="688" fill="url(#heroWash)"/><circle cx="1260" cy="180" r="180" fill="#DCE6D9" opacity="0.24"/><circle cx="1120" cy="330" r="130" fill="#DCE6D9" opacity="0.3"/><circle cx="1340" cy="520" r="160" fill="#DCE6D9" opacity="0.36"/><path d="M1180 720 C1195 590 1265 470 1360 355" stroke="#7FA387" stroke-width="2" opacity=".5"/><ellipse cx="1220" cy="610" rx="24" ry="52" transform="rotate(-28 1220 610)" fill="#7FA387" opacity=".22"/><ellipse cx="1260" cy="540" rx="24" ry="52" transform="rotate(20 1260 540)" fill="#7FA387" opacity=".22"/><ellipse cx="1300" cy="470" rx="24" ry="52" transform="rotate(-18 1300 470)" fill="#7FA387" opacity=".22"/><ellipse cx="1340" cy="400" rx="24" ry="52" transform="rotate(28 1340 400)" fill="#7FA387" opacity=".22"/></g><g id="Hero-Copy"><text x="72" y="165" class="sans" font-size="13" font-weight="700" letter-spacing="2.5" fill="#7FA387">HEALTH INFORMATION, MADE CLEARER</text><text x="72" y="270" class="serif" font-size="58" font-weight="700" fill="#183029">Understand your</text><text x="72" y="338" class="serif" font-size="58" font-style="italic" fill="#355E46">health information.</text><text x="72" y="406" class="serif" font-size="58" font-weight="700" fill="#183029">Review your progress.</text><text x="72" y="474" class="serif" font-size="58" font-weight="700" fill="#183029">Take the next safe step.</text><text x="72" y="538" class="sans" font-size="17" fill="#64736B">HILERA helps you understand health information, see changes over time,</text><text x="72" y="566" class="sans" font-size="17" fill="#64736B">and know an appropriate next step without replacing professional healthcare.</text><g id="Button-Create-account">
<rect x="72" y="610" width="180" height="52" rx="14" fill="#1F3D2E" stroke="#1F3D2E"/>
<g id="Icon-arrow" transform="translate(90 624) scale(0.8333333333333334)" fill="none" stroke="#F7F4ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M14 7l5 5-5 5"/></g>
<text x="171.0" y="643" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#F7F4ED">Create account</text>
</g><g id="Button-Sign-in">
<rect x="268" y="610" width="130" height="52" rx="14" fill="#FFFFFF" stroke="#D9E1DB"/>

<text x="333.0" y="643" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#1F3D2E">Sign in</text>
</g></g><g id="Product-Preview"><rect x="855" y="160" width="500" height="520" rx="30" fill="#FFFFFF" stroke="#D9E1DB" filter="url(#shadow)"/><text x="900" y="215" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#7FA387">YOUR HEALTH, OVER TIME</text><text x="900" y="265" class="serif" font-size="31" font-weight="700" fill="#183029">Simple at first glance.</text><rect x="900" y="294" width="410" height="66" rx="16" fill="#EEF3ED" stroke="#D9E1DB"/><circle cx="934" cy="327" r="20" fill="#DCE6D9"/><g id="Icon-summary" transform="translate(922 315) scale(1.0)" fill="none" stroke="#1F3D2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6V3Z"/><path d="M15 3v5h5M9 12h7M9 16h6"/></g><text x="972" y="323" class="sans" font-size="16" font-weight="700" fill="#183029">Health information</text><text x="972" y="347" class="sans" font-size="12.5" fill="#64736B">Keep important information together.</text><rect x="900" y="376" width="410" height="66" rx="16" fill="#EEF3ED" stroke="#D9E1DB"/><circle cx="934" cy="409" r="20" fill="#DCE6D9"/><g id="Icon-history" transform="translate(922 397) scale(1.0)" fill="none" stroke="#1F3D2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 8A8 8 0 1 1 4 14"/><path d="M4.5 8V3.5M4.5 8H9"/><path d="M12 7v5l3 2"/></g><text x="972" y="405" class="sans" font-size="16" font-weight="700" fill="#183029">Review</text><text x="972" y="429" class="sans" font-size="12.5" fill="#64736B">Look back at what you recorded.</text><rect x="900" y="458" width="410" height="66" rx="16" fill="#EEF3ED" stroke="#D9E1DB"/><circle cx="934" cy="491" r="20" fill="#DCE6D9"/><g id="Icon-trend" transform="translate(922 479) scale(1.0)" fill="none" stroke="#1F3D2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-5 4 3 7-9"/><path d="M16 7h4v4"/></g><text x="972" y="487" class="sans" font-size="16" font-weight="700" fill="#183029">Changes over time</text><text x="972" y="511" class="sans" font-size="12.5" fill="#64736B">See supported information over time.</text><rect x="900" y="540" width="410" height="66" rx="16" fill="#EEF3ED" stroke="#D9E1DB"/><circle cx="934" cy="573" r="20" fill="#DCE6D9"/><g id="Icon-action" transform="translate(922 561) scale(1.0)" fill="none" stroke="#1F3D2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M8 12h8M13 8l4 4-4 4"/></g><text x="972" y="569" class="sans" font-size="16" font-weight="700" fill="#183029">Next step</text><text x="972" y="593" class="sans" font-size="12.5" fill="#64736B">Follow approved guidance when available.</text></g><g id="Trust-Strip"><rect x="72" y="820" width="1296" height="112" rx="24" fill="#1F3D2E"/><g id="Icon-shield" transform="translate(110.0 853) scale(0.9166666666666666)" fill="none" stroke="#F7F4ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.6-2.3 8-7 10-4.7-2-7-5.4-7-10V6l7-3Z"/><path d="M9 12l2 2 4-5"/></g><text x="144.0" y="868" class="sans" font-size="14" font-weight="700" fill="#F7F4ED">Privacy by design</text><text x="144.0" y="892" class="sans" font-size="12.5" fill="#D5E2D8">Your information is handled with care.</text><g id="Icon-eye" transform="translate(434.0 853) scale(0.9166666666666666)" fill="none" stroke="#F7F4ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12s3.2-5 9-5 9 5 9 5-3.2 5-9 5-9-5-9-5Z"/><circle cx="12" cy="12" r="2.5"/></g><text x="468.0" y="868" class="sans" font-size="14" font-weight="700" fill="#F7F4ED">You stay in control</text><text x="468.0" y="892" class="sans" font-size="12.5" fill="#D5E2D8">Know what is collected and why.</text><g id="Icon-book" transform="translate(758.0 853) scale(0.9166666666666666)" fill="none" stroke="#F7F4ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5c3-1 5.5-.5 8 1.2v13c-2.5-1.7-5-2.2-8-1.2v-13Z"/><path d="M20 5.5c-3-1-5.5-.5-8 1.2v13c2.5-1.7 5-2.2 8-1.2v-13Z"/></g><text x="792.0" y="868" class="sans" font-size="14" font-weight="700" fill="#F7F4ED">Clear explanations</text><text x="792.0" y="892" class="sans" font-size="12.5" fill="#D5E2D8">Health information in simpler words.</text><g id="Icon-check" transform="translate(1082.0 853) scale(0.9166666666666666)" fill="none" stroke="#F7F4ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l2.5 2.5L16 9"/></g><text x="1116.0" y="868" class="sans" font-size="14" font-weight="700" fill="#F7F4ED">Clinically bounded</text><text x="1116.0" y="892" class="sans" font-size="12.5" fill="#D5E2D8">No unsupported diagnosis or treatment.</text></g></svg>