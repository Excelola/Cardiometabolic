<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>HILERA Landing</title>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#1F3D2E" flood-opacity="0.08"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="160%" height="180%">
    <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#1F3D2E" flood-opacity="0.06"/>
  </filter>
  <linearGradient id="heroWash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F7F4ED"/>
    <stop offset="100%" stop-color="#DCE6D9"/>
  </linearGradient>
  <style>
    .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
  </style>
</defs>
<rect width="1440" height="1024" fill="#F7F4ED"/>
<g id="Topbar">
<rect x="0" y="0" width="1440" height="88" fill="#FFFFFF"/>
<line x1="0" y1="88" x2="1440" y2="88" stroke="#D9E1DB"/>

<g id="Brand-Lockup">

