<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>Welcome back</title>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#1F3D2E" flood-opacity="0.08"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="160%" height="180%">
    <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#1F3D2E" flood-opacity="0.06"/>
  </filter>
  <linearGradient id="heroWash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F7F4ED"/>
    <stop offset="100%" stop-color="#DCE6D9"/>
  </linearGradient>
  <style>
    .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
  </style>
</defs>
<rect width="1440" height="1024" fill="#F7F4ED"/>
<g id="Topbar">
<rect x="0" y="0" width="1440" height="88" fill="#FFFFFF"/>
<line x1="0" y1="88" x2="1440" y2="88" stroke="#D9E1DB"/>

<g id="Brand-Lockup">

<g id="Logo-Mark" transform="translate(72 44) scale(0.78)">
  <circle cx="0" cy="0" r="29" fill="none" stroke="#1F3D2E" stroke-width="3"/>
  <rect x="-11" y="-14" width="6" height="29" rx="3" fill="#1F3D2E"/>
  <rect x="6" y="-5" width="6" height="20" rx="3" fill="#1F3D2E"/>
  <circle cx="9" cy="-14" r="4.5" fill="#D8A77A"/>
  <path d="M-5 2 C0 -5, 7 -8, 12 -7 C8 -1, 2 5, -5 9 Z" fill="#7FA387"/>
</g>
<text x="107.1" y="51.02" class="sans" font-size="20.28" font-weight="700" letter-spacing="4.68" fill="#1F3D2E">HILERA</text>
</g>
<text x="930" y="51" class="sans" font-size="14" font-weight="600" fill="#183029">How it works</text><text x="1027" y="51" class="sans" font-size="14" font-weight="600" fill="#183029">Why HILERA</text><text x="1124" y="51" class="sans" font-size="14" font-weight="600" fill="#183029">Learn</text><text x="1202" y="51" class="sans" font-size="14" font-weight="700" fill="#1F3D2E">Sign in</text><rect x="1270" y="24" width="126" height="40" rx="12" fill="#1F3D2E"/><text x="1333" y="50" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#F7F4ED">Create account</text></g><g id="Background-Accent"><circle cx="1160" cy="270" r="220" fill="#DCE6D9" opacity=".38"/><circle cx="1280" cy="690" r="260" fill="#EEF3ED" opacity=".6"/></g><text x="150" y="190" class="sans" font-size="13" font-weight="700" letter-spacing="2.5" fill="#7FA387">SECURE ACCOUNT ACCESS</text><text x="150" y="265" class="serif" font-size="48" font-weight="700" fill="#183029">Welcome back</text><text x="150" y="306" class="sans" font-size="16" fill="#64736B">Choose a verified phone number or email address to continue.</text><g id="Sign-In-Card"><rect x="150" y="350" width="1120" height="450" rx="28" fill="#FFFFFF" stroke="#D9E1DB" filter="url(#shadow)"/><rect x="200" y="445" width="450" height="210" rx="22" fill="#EEF3ED" stroke="#D9E1DB"/><circle cx="256" cy="502" r="28" fill="#DCE6D9"/><g id="Icon-phone" transform="translate(244 490) scale(1.0)" fill="none" stroke="#1F3D2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M10 6h4M11 18h2"/></g><text x="305" y="497" class="sans" font-size="20" font-weight="700" fill="#183029">Sign in with phone</text><text x="305" y="529" class="sans" font-size="14" fill="#64736B">Use your verified phone number.</text><g id="Button-Continue">
<rect x="305" y="570" width="170" height="52" rx="14" fill="#1F3D2E" stroke="#1F3D2E"/>
<g id="Icon-arrow" transform="translate(323 584) scale(0.8333333333333334)" fill="none" stroke="#F7F4ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M14 7l5 5-5 5"/></g>
<text x="399.0" y="603" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#F7F4ED">Continue</text>
</g><rect x="700" y="445" width="450" height="210" rx="22" fill="#EEF3ED" stroke="#D9E1DB"/><circle cx="756" cy="502" r="28" fill="#DCE6D9"/><g id="Icon-mail" transform="translate(744 490) scale(1.0)" fill="none" stroke="#1F3D2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></g><text x="805" y="497" class="sans" font-size="20" font-weight="700" fill="#183029">Sign in with email</text><text x="805" y="529" class="sans" font-size="14" fill="#64736B">Use your verified email address.</text><g id="Button-Continue">
<rect x="805" y="570" width="170" height="52" rx="14" fill="#1F3D2E" stroke="#1F3D2E"/>
<g id="Icon-arrow" transform="translate(823 584) scale(0.8333333333333334)" fill="none" stroke="#F7F4ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M14 7l5 5-5 5"/></g>
<text x="899.0" y="603" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#F7F4ED">Continue</text>
</g><text x="200" y="724" class="sans" font-size="13" fill="#64736B">Need help accessing your account? Use the approved recovery path when available.</text></g></svg>