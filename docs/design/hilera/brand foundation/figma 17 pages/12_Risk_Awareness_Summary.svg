<text x="300" y="198" class="sans" font-size="17" fill="#64736B">A clinically governed summary appears only when approved requirements are satisfied.</text>
</g><g id="Risk-Summary-Shell"><rect x="300" y="245" width="1080" height="665" rx="24" fill="#FFFFFF" stroke="#D9E1DB" filter="url(#shadow)"/><text x="345" y="300" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#7FA387">CARDIOMETABOLIC RISK AWARENESS SUMMARY</text><rect x="345" y="345" width="990" height="150" rx="20" fill="#EEF3ED" stroke="#D9E1DB"/><circle cx="397" cy="420" r="28" fill="#DCE6D9"/><g id="Icon-summary" transform="translate(385 408) scale(1.0)" fill="none" stroke="#1F3D2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6V3Z"/><path d="M15 3v5h5M9 12h7M9 16h6"/></g><text x="445" y="405" class="serif" font-size="27" font-weight="700" fill="#183029">Your summary is not ready yet.</text><text x="445" y="441" class="sans" font-size="14" fill="#64736B">Required information or approved clinical logic is still unavailable.</text><g id="Summary-Section-1"><rect x="345" y="545" width="470" height="112" rx="18" fill="#FFFFFF" stroke="#D9E1DB"/><text x="369" y="583" class="sans" font-size="16" font-weight="700" fill="#183029">Information considered</text><text x="369" y="611" class="sans" font-size="12.5" fill="#64736B">Only approved inputs used by the applicable specification</text><text x="369" y="631" class="sans" font-size="12.5" fill="#64736B">will appear here.</text></g><g id="Summary-Section-2"><rect x="845" y="545" width="470" height="112" rx="18" fill="#FFFFFF" stroke="#D9E1DB"/><text x="869" y="583" class="sans" font-size="16" font-weight="700" fill="#183029">Missing information</text><text x="869" y="611" class="sans" font-size="12.5" fill="#64736B">HILERA will identify approved missing inputs instead of</text><text x="869" y="631" class="sans" font-size="12.5" fill="#64736B">fabricating a result.</text></g><g id="Summary-Section-3"><rect x="345" y="685" width="470" height="112" rx="18" fill="#FFFFFF" stroke="#D9E1DB"/><text x="369" y="723" class="sans" font-size="16" font-weight="700" fill="#183029">Education</text><text x="369" y="751" class="sans" font-size="12.5" fill="#64736B">Approved explanations can help you understand the</text><text x="369" y="771" class="sans" font-size="12.5" fill="#64736B">information shown.</text></g><g id="Summary-Section-4"><rect x="845" y="685" width="470" height="112" rx="18" fill="#FFFFFF" stroke="#D9E1DB"/><text x="869" y="723" class="sans" font-size="16" font-weight="700" fill="#183029">Next step</text><text x="869" y="751" class="sans" font-size="12.5" fill="#64736B">An approved action appears only when product or clinical</text><text x="869" y="771" class="sans" font-size="12.5" fill="#64736B">rules authorise it.</text></g></g></svg>