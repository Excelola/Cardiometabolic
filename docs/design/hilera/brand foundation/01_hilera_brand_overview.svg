  <rect x="-12.2" y="-12.2" width="6.5" height="24.5" rx="3.2" fill="#1F3D2E"/>
  <rect x="5.0" y="-3.6" width="6.5" height="15.8" rx="3.2" fill="#1F3D2E"/>
