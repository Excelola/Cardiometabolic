<text x="170.0" y="105.0" class="sans" font-size="36.0" font-weight="700" letter-spacing="7.0" fill="#1F3D2E">HILERA</text>

<text x="112" y="190" class="sans" font-size="18" font-weight="700" letter-spacing="4" fill="#7FA387">BRAND FOUNDATIONS</text>
<text x="112" y="285" class="serif" font-size="72" font-weight="700" fill="#183029">Quiet confidence.</text>
<text x="112" y="365" class="serif" font-size="72" font-style="italic" fill="#355E46">Health, understood over time.</text>
<text x="112" y="435" class="sans" font-size="24" fill="#64736B">Luxury editorial product UI for a calm, mature and trustworthy health experience.</text>

<rect x="112" y="520" width="1376" height="240" rx="28" fill="#FFFFFF" stroke="#D9E1DB" filter="url(#softShadow)"/>
<text x="160" y="580" class="sans" font-size="18" font-weight="700" letter-spacing="3" fill="#7FA387">BRAND CHARACTER</text>
<circle cx="172" cy="628" r="6" fill="#7FA387"/><text x="192" y="635" class="sans" font-size="22" font-weight="700" fill="#183029">Premium</text><text x="192" y="665" class="sans" font-size="17" fill="#64736B">Refined, never flashy</text><circle cx="602" cy="628" r="6" fill="#7FA387"/><text x="622" y="635" class="sans" font-size="22" font-weight="700" fill="#183029">Calm</text><text x="622" y="665" class="sans" font-size="17" fill="#64736B">Low-noise and reassuring</text><circle cx="1032" cy="628" r="6" fill="#7FA387"/><text x="1052" y="635" class="sans" font-size="22" font-weight="700" fill="#183029">Mature</text><text x="1052" y="665" class="sans" font-size="17" fill="#64736B">Balanced saturation and restraint</text><circle cx="172" cy="712" r="6" fill="#7FA387"/><text x="192" y="719" class="sans" font-size="22" font-weight="700" fill="#183029">Private</text><text x="192" y="749" class="sans" font-size="17" fill="#64736B">Trust is visible by design</text><circle cx="602" cy="712" r="6" fill="#7FA387"/><text x="622" y="719" class="sans" font-size="22" font-weight="700" fill="#183029">Powerful</text><text x="622" y="749" class="sans" font-size="17" fill="#64736B">Simple surfaces, deeper value underneath</text><circle cx="1032" cy="712" r="6" fill="#7FA387"/><text x="1052" y="719" class="sans" font-size="22" font-weight="700" fill="#183029">Human</text><text x="1052" y="749" class="sans" font-size="17" fill="#64736B">Editorial warmth, not clinical coldness</text>
<rect x="112" y="820" width="1376" height="92" rx="24" fill="#1F3D2E"/>
<text x="152" y="875" class="serif" font-size="31" fill="#F7F4ED">Simple at first glance. Powerful when you go deeper.</text>
<text x="1335" y="875" text-anchor="end" class="sans" font-size="16" font-weight="700" letter-spacing="2" fill="#DCE6D9">HILERA MVP UX PRINCIPLE</text>
