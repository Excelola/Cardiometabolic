<rect width="1600" height="1000" fill="#F7F4ED"/><text x="100" y="100" class="sans" font-size="18" font-weight="700" letter-spacing="4" fill="#7FA387">03 / TYPOGRAPHY</text><text x="100" y="170" class="serif" font-size="54" font-weight="700" fill="#183029">Editorial warmth + product clarity</text><text x="100" y="215" class="sans" font-size="20" fill="#64736B">Serif for emotional hierarchy. Sans-serif for action, navigation and data.</text>
<rect x="100" y="280" width="1400" height="300" rx="28" fill="#FFFFFF" stroke="#D9E1DB"/>
<text x="145" y="335" class="sans" font-size="15" font-weight="700" letter-spacing="2" fill="#7FA387">DISPLAY / GEORGIA-STYLE SERIF</text>
<text x="145" y="425" class="serif" font-size="68" font-weight="700" fill="#183029">Understand your health.</text>
<text x="145" y="505" class="serif" font-size="64" font-style="italic" fill="#355E46">Over time. With clarity.</text>

<rect x="100" y="620" width="1400" height="250" rx="28" fill="#FFFFFF" stroke="#D9E1DB"/>
<text x="145" y="675" class="sans" font-size="15" font-weight="700" letter-spacing="2" fill="#7FA387">PRODUCT UI / INTER-STYLE SANS</text>
<text x="145" y="730" class="sans" font-size="32" font-weight="700" fill="#183029">Dashboard heading 32 / 700</text>
<text x="145" y="778" class="sans" font-size="22" font-weight="600" fill="#183029">Card title 22 / 600</text>
