<rect width="1600" height="1000" fill="#F7F4ED"/><text x="100" y="100" class="sans" font-size="18" font-weight="700" letter-spacing="4" fill="#7FA387">04 / UI FOUNDATIONS</text><text x="100" y="170" class="serif" font-size="54" font-weight="700" fill="#183029">Simple, powerful, straightforward</text><text x="100" y="215" class="sans" font-size="20" fill="#64736B">Quiet surfaces, clear actions, soft geometry and concise information.</text><text x="100" y="300" class="sans" font-size="16" font-weight="700" letter-spacing="2" fill="#7FA387">BUTTONS</text><rect x="100" y="330" width="250" height="64" rx="16" fill="#1F3D2E"/><text x="225" y="370" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#F7F4ED">Create account</text><rect x="375" y="330" width="205" height="64" rx="16" fill="#FFFFFF" stroke="#7FA387"/><text x="477" y="370" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#1F3D2E">See how it works</text><text x="660" y="300" class="sans" font-size="16" font-weight="700" letter-spacing="2" fill="#7FA387">STATUS</text><rect x="660" y="330" width="145" height="40" rx="20" fill="#E5EFE3"/><text x="732" y="356" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#355E46">In range</text><rect x="830" y="330" width="145" height="40" rx="20" fill="#E8EEE9"/><text x="902" y="356" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#1F3D2E">Tracking</text><rect x="1000" y="330" width="145" height="40" rx="20" fill="#F3ECE4"/><text x="1072" y="356" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#8A674A">Needs input</text><text x="100" y="475" class="sans" font-size="16" font-weight="700" letter-spacing="2" fill="#7FA387">CARDS + INFORMATION</text><rect x="100" y="510" width="410" height="210" rx="24" fill="#FFFFFF" stroke="#D9E1DB" filter="url(#softShadow)"/><circle cx="155" cy="565" r="28" fill="#DCE6D9"/><text x="155" y="575" text-anchor="middle" class="sans" font-size="26" font-weight="700" fill="#1F3D2E">↗</text><text x="132" y="640" class="serif" font-size="28" font-weight="700" fill="#183029">Longitudinal</text><text x="132" y="678" class="sans" font-size="17" fill="#64736B">Your health. Organized over time.</text><rect x="555" y="510" width="410" height="210" rx="24" fill="#FFFFFF" stroke="#D9E1DB" filter="url(#softShadow)"/><circle cx="610" cy="565" r="28" fill="#DCE6D9"/><text x="610" y="575" text-anchor="middle" class="sans" font-size="26" font-weight="700" fill="#1F3D2E">✓</text><text x="587" y="640" class="serif" font-size="28" font-weight="700" fill="#183029">Evidence</text><text x="587" y="678" class="sans" font-size="17" fill="#64736B">Grounded in trusted science.</text><rect x="1010" y="510" width="410" height="210" rx="24" fill="#FFFFFF" stroke="#D9E1DB" filter="url(#softShadow)"/><circle cx="1065" cy="565" r="28" fill="#DCE6D9"/><text x="1065" y="575" text-anchor="middle" class="sans" font-size="26" font-weight="700" fill="#1F3D2E">→</text><text x="1042" y="640" class="serif" font-size="28" font-weight="700" fill="#183029">Action</text><text x="1042" y="678" class="sans" font-size="17" fill="#64736B">Clear next steps.</text><rect x="100" y="780" width="1400" height="125" rx="26" fill="#1F3D2E"/><circle cx="145" cy="842" r="20" fill="none" stroke="#DCE6D9" stroke-width="2"/><text x="181" y="848" class="sans" font-size="17" font-weight="600" fill="#F7F4ED">Privacy by design</text><circle cx="480" cy="842" r="20" fill="none" stroke="#DCE6D9" stroke-width="2"/><text x="516" y="848" class="sans" font-size="17" font-weight="600" fill="#F7F4ED">Encrypted in transit &amp; at rest</text><circle cx="815" cy="842" r="20" fill="none" stroke="#DCE6D9" stroke-width="2"/><text x="851" y="848" class="sans" font-size="17" font-weight="600" fill="#F7F4ED">You decide what to share</text><circle cx="1150" cy="842" r="20" fill="none" stroke="#DCE6D9" stroke-width="2"/><text x="1186" y="848" class="sans" font-size="17" font-weight="600" fill="#F7F4ED">No data sold. Ever.</text></svg>